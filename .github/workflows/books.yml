# The mvsMF manuals, ML08-0001 and ML08-0002 (docs/books), built with typst on
# every PR and push to main, so a broken reference, label or syntax error
# fails the change that made it. typst is pinned by version AND sha256, the
# fonts come from the bookmaster submodule. The PDFs are kept as the artifact
# `books`.
name: books

on:
  pull_request:
  push:
    branches: [main]

jobs:
  books:
    name: manuals (typst)
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: 0.15.1
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install typst (pinned)
        run: |
          f=typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL --proto "=https" --tlsv1.2 -O "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/$f"
          echo "$TYPST_SHA256  $f" | sha256sum -c -
          tar xf "$f"
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Build the manuals
        run: make -C docs/books

      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: docs/books/*.pdf
          if-no-files-found: error
